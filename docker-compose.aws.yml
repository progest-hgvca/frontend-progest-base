services:
  # --- Frontend Vue.js ---
  progest-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    image: progest-web:latest
    env_file:
      - ./.env.aws
    networks:
      - traefik-public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Rota Agnóstica para testes em IP (HTTP puro)
      - "traefik.http.routers.progest-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.progest-web.entrypoints=web"
      - "traefik.http.services.progest-web.loadbalancer.server.port=80"

# --- Networks ---
networks:
  traefik-public:
    external: true
    name: traefik-public
